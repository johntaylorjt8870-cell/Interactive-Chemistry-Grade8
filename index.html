<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="منصة تفاعلية تعليمية للفيزياء والكيمياء للصف الثامن — مبنية على الكتاب المدرسي الرسمي."
    />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>منصة الفيزياء والكيمياء — الصف الثامن</title>
    <script>
      // Applied before first paint so the chosen theme never flashes.
      (function () {
        try {
          var stored = window.localStorage.getItem('ipc:theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : null
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; text-align: center">
        تحتاج هذه المنصة إلى تشغيل JavaScript لعرض المحتوى التفاعلي.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
