name: CI

# Validation gate for pull requests.
#
# deploy-pages.yml is the only publishing mechanism in this repository and it
# runs only on `push` to main (plus workflow_dispatch). As a result a pull
# request was never compiled, tested or dist-verified: GitHub reported it as
# "mergeable / clean" with zero checks, so an unvalidated lesson PR — and, worse,
# an *unmerged* one — produced no signal at all.
# See docs/DEPLOYMENT_INCIDENT-LESSON4.md for the incident this closes.
#
# This workflow never publishes anything:
#   * it requests `contents: read` only — no `pages` and no `id-token` write;
#   * it does not configure Pages, upload a Pages artifact, or deploy;
#   * deploy-pages.yml is untouched and remains the single deployment path.
#
# The step order mirrors deploy-pages.yml exactly, so a green check here means
# the same pipeline the deployment runs has already passed on the PR head.
#
# The `rendering` job adds the real-Chromium checks that jsdom cannot cover.
# It is deliberately limited to the highest-value, bounded-cost checks:
# `verify:charges` (the shared scientific-notation contract — one inline
# notation unit and one baseline raise for every charge), `verify:badges`
# (interactive badge centring and geometry) and `verify:lesson6` (full lesson
# walk + axe). The lesson 1-5 rendering scripts each walk every step across
# multiple viewports with per-step axe runs (minutes each), so they remain
# one-command local checks (`npm run verify:lesson<N>`) instead of multiplying
# every PR's cost.
# The browser harness is installed pinned with `--no-save`, matching the
# scripts' documented on-demand model, so the ~70 MB Chromium binary stays
# out of the project's dependencies and lockfile.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, verify and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify production output (base path and deep links)
        run: npm run verify:dist

      # Tests run after the build so the production-build assertions (base path,
      # 404.html fallback, emitted assets) are actually exercised, matching the
      # order enforced by tests/deployment.test.ts for the Pages workflow.
      - name: Run tests
        run: npm test

  rendering:
    name: Chromium rendering (badges, charges + lesson 6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Optional browser harness for the rendering scripts. Pinned to the
      # exact versions verified locally; `--no-save` keeps them out of
      # package.json and package-lock.json (see the note at the top).
      - name: Install optional Chromium harness (pinned, not saved)
        run: npm install --no-save puppeteer-core@25.16.0 @sparticuz/chromium@153.0.0

      # `npm run build` already runs the TypeScript compiler (`tsc -b`), so
      # no separate typecheck step is needed in this job.
      - name: Build production bundle
        run: npm run build

      - name: Verify badge rendering (shared scientific notation)
        run: npm run verify:badges

      - name: Verify charge notation (shared scientific-notation contract)
        run: npm run verify:charges

      - name: Verify lesson 6 rendering
        run: npm run verify:lesson6

      # Screenshots and JSON reports are the evidence needed to debug a
      # rendering failure; keep them only when this job fails.
      - name: Upload rendering artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
